<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesiones de Estudio</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="app-container">
        <nav class="nav-tabs">
            <button id="tab-timer-btn" class="tab-btn active" onclick="switchTab('timer')">Cronómetro</button>
            <button id="tab-stats-btn" class="tab-btn" onclick="switchTab('stats')">Estadísticas</button>
        </nav>

        <main id="view-timer" class="view active">
            <div class="card timer-card">
                <div class="input-group">
                    <label for="subject-input">Materia o Tema</label>
                    <input type="text" id="subject-input" placeholder="Ej. Cálculo, Física, Anatomía..." autocomplete="off">
                </div>

                <div class="timer-display" id="timer-display">00:00:00</div>

                <div class="controls">
                    <button id="start-btn" class="btn btn-primary" onclick="startTimer()">Iniciar Sesión</button>
                    <button id="stop-btn" class="btn btn-danger hidden" onclick="stopTimer()">Detener</button>
                </div>
            </div>
        </main>

        <main id="view-stats" class="view">
            <div class="card chart-card">
                <h2>Rendimiento por Sesión</h2>
                <div class="chart-container">
                    <canvas id="sessionsChart"></canvas>
                </div>
            </div>

            <div class="card history-card">
                <div class="card-header">
                    <h2>Historial de Sesiones</h2>
                    <button id="reset-btn" class="btn btn-danger-soft btn-sm" onclick="confirmResetData()">Restablecer datos</button>
                </div>
                <div id="sessions-list" class="sessions-list">
                </div>
            </div>
        </main>
    </div>

    <div id="notes-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>Sesión Finalizada</h3>
            <p id="modal-session-summary" class="summary-text"></p>
            
            <div class="input-group">
                <label for="modal-notes">¿Hubo alguna distracción o alguna nota sobre cómo te sentiste?</label>
                <textarea id="modal-notes" rows="4" placeholder="Ej. Me distraje con el teléfono / Me sentí muy enfocado en los ejemplos teóricos..."></textarea>
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="discardSession()">Descartar</button>
                <button class="btn btn-primary" onclick="saveSession()">Guardar Sesión</button>
            </div>
        </div>
    </div>

    <div id="detail-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="detail-subject">Detalles de la Sesión</h3>
            <div class="detail-info">
                <p><strong>Fecha:</strong> <span id="detail-date"></span></p>
                <p><strong>Horario:</strong> <span id="detail-time"></span></p>
                <p><strong>Duración total:</strong> <span id="detail-duration"></span></p>
            </div>
            <div class="detail-notes-box">
                <strong>Anotaciones / Distracciones:</strong>
                <p id="detail-notes" class="notes-text"></p>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeDetailModal()">Cerrar</button>
                <button class="btn btn-danger-soft" onclick="deleteCurrentDetailSession()">Eliminar Sesión</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
